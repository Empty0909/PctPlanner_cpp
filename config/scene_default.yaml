pct_tomography_cpp:
  ros__parameters:
    # 场景栅格参数（与原 scene.py 对齐）
    resolution: 0.15        # 栅格分辨率（米/格）
    slice_dh: 0.5           # 垂直切片间距（米）
    ground_h: 0.0           # 地面参考高度（米），用于覆盖点云最低高度

    # 可行域/间隙参数
    kernel_size: 5          # 膨胀卷积核尺寸（奇数，越大膨胀越强）
    interval_min: 0.50      # 允许通过的最小间隙高度（米）
    interval_free: 0.6     # 无惩罚间隙阈值（米，超过此高度视为畅通）
    slope_max: 1.0         # 最大坡度（用于估计可站立高度 step_stand）
    step_max: 0.7          # 可跨越的最大台阶高度差（米）
    standable_ratio: 0.40   # 邻域可站立比例阈值
    cost_barrier: 50.0      # 代价屏障阈值，>= 此值视为不可通行

    # 膨胀参数
    safe_margin: 0.1        # 安全边界（米，决定障碍膨胀半径）
    inflation: 0.05         # 膨胀附加成本（越大通行区越少）

    # 其他
    map_frame: "map"       # 发布点云/可视化使用的坐标系
    surface_only: true      # true 只发布地面可视化，false 发布全体素（点数大）
    output_path: "/home/lzy/PctPlanner/PctPlanner_Cpp/rsc/tomogram/scene_map.bin"  # tomogram 二进制输出路径
    precision_mode: "float16"   # 可选 float16 / float32

pct_planner_cpp:
  ros__parameters:
    use_quintic: true              # 轨迹优化是否使用五次多项式（平滑但约束更强）
    max_heading_rate: 10.0         # 最大航向角速度（deg/s），过小会限制转弯
    pcd_path: "/home/lzy/PctPlanner/PctPlanner_Cpp/trajectory.pcd"    # 在线规划器输出的 ASCII PCD 路径

pct_planner_direct_cpp:
  ros__parameters:
    use_quintic: true                    # 同上，离线规划器版本
    max_heading_rate: 10.0               # 同上
    pcd_path: "/home/lzy/PctPlanner/PctPlanner_Cpp/trajectory.pcd"   # 离线规划器输出的 ASCII PCD 路径
    tomo_path: "/home/lzy/PctPlanner/PctPlanner_Cpp/rsc/tomogram/scene_map.bin"  # 离线规划读取的 tomogram 文件